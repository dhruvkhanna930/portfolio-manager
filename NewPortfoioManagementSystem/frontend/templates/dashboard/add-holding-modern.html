{% extends "dashboard/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'dashboard/css/glassmorphism.css' %}">

<style>
  .page-header {
    margin-bottom: 2rem;
  }

  .page-header h1 {
    font-size: 2.5rem;
    color: #2c3e50;
    margin-bottom: 0.5rem;
    font-weight: 700;
  }

  .page-header p {
    color: #666;
    font-size: 1.1rem;
  }

  .form-container {
    max-width: 600px;
    margin: 0 auto;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
  }

  .form-grid.full {
    grid-column: 1 / -1;
  }

  .button-group {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.8);
    color: #667eea;
    border: 2px solid #667eea;
  }

  .success-message {
    display: none;
    padding: 1.5rem;
    background: rgba(81, 207, 102, 0.1);
    border-left: 4px solid #51cf66;
    border-radius: 12px;
    color: #51cf66;
    margin-bottom: 1.5rem;
    animation: slideUp 0.5s ease;
  }

  .success-message.show {
    display: block;
  }

  @media (max-width: 768px) {
    .form-grid {
      grid-template-columns: 1fr;
    }

    .page-header h1 {
      font-size: 1.75rem;
    }

    .button-group {
      flex-direction: column;
    }

    .btn-glass {
      width: 100%;
    }
  }
</style>

<div class="page-header">
  <h1>💼 Add New Holding</h1>
  <p>Add a stock or investment to your portfolio</p>
</div>

<div class="form-container">
  <div class="success-message" id="successMsg">
    ✓ Stock added successfully to your portfolio!
  </div>

  <div class="glass-container">
    <form id="holdingForm" class="glass-form">
      {% csrf_token %}

      <!-- Company Selection -->
      <div class="form-group">
        <label for="company">Select Company</label>
        <div style="position: relative;">
          <input
            type="text"
            id="company"
            name="company"
            placeholder="Search by company name or symbol..."
            autocomplete="off"
            required
            style="width: 100%; padding: 0.875rem 1.25rem; border: 2px solid rgba(102, 126, 234, 0.2); border-radius: 12px;"
          >
          <div id="companyDropdown" style="
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
          "></div>
        </div>
        <div class="form-error" id="companyError"></div>
      </div>

      <!-- Investment Amount -->
      <div class="form-group">
        <label for="amount">Investment Amount ($)</label>
        <input
          type="number"
          id="amount"
          name="amount"
          placeholder="e.g., 5000"
          step="0.01"
          min="0"
          required
        >
        <div class="form-error" id="amountError"></div>
      </div>

      <!-- Number of Shares -->
      <div class="form-group">
        <label for="shares">Number of Shares</label>
        <input
          type="number"
          id="shares"
          name="shares"
          placeholder="e.g., 50"
          step="1"
          min="1"
          required
        >
        <div class="form-error" id="sharesError"></div>
      </div>

      <!-- Purchase Date -->
      <div class="form-group">
        <label for="date">Purchase Date</label>
        <input
          type="date"
          id="date"
          name="date"
          required
        >
        <div class="form-error" id="dateError"></div>
      </div>

      <!-- Purchase Price -->
      <div class="form-group">
        <label for="price">Purchase Price (Per Share)</label>
        <input
          type="number"
          id="price"
          name="price"
          placeholder="Auto-calculated from date"
          step="0.01"
          min="0"
          readonly
          style="background: rgba(0, 0, 0, 0.05); color: #999;"
        >
      </div>

      <!-- Notes -->
      <div class="form-group" style="grid-column: 1 / -1;">
        <label for="notes">Notes (Optional)</label>
        <textarea
          id="notes"
          name="notes"
          placeholder="Add any notes about this investment..."
          style="min-height: 100px;"
        ></textarea>
      </div>

      <!-- Summary Card -->
      <div style="
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        border: 1px solid rgba(102, 126, 234, 0.2);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1rem;
      ">
        <h4 style="margin-top: 0; margin-bottom: 1rem; color: #2c3e50; font-size: 1.1rem;">
          📊 Investment Summary
        </h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <span style="color: #999; font-size: 0.9rem;">Total Cost</span>
            <p style="margin: 0.5rem 0 0 0; font-size: 1.5rem; font-weight: 600; color: #667eea;" id="totalCost">
              $0.00
            </p>
          </div>
          <div>
            <span style="color: #999; font-size: 0.9rem;">Per Share</span>
            <p style="margin: 0.5rem 0 0 0; font-size: 1.5rem; font-weight: 600; color: #667eea;" id="perShare">
              $0.00
            </p>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="submit" class="btn-glass" id="submitBtn">
          ✓ Add to Portfolio
        </button>
        <button type="reset" class="btn-glass btn-secondary">
          Clear Form
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('holdingForm');
  const companyInput = document.getElementById('company');
  const dropdown = document.getElementById('companyDropdown');
  const amountInput = document.getElementById('amount');
  const sharesInput = document.getElementById('shares');
  const priceInput = document.getElementById('price');
  const dateInput = document.getElementById('date');
  const successMsg = document.getElementById('successMsg');
  const submitBtn = document.getElementById('submitBtn');

  let companies = [];

  // Load companies on page load
  fetch('/api/companies/')
    .then(res => res.json())
    .then(data => {
      companies = data.data;
    })
    .catch(err => console.error('Error loading companies:', err));

  // Company search
  companyInput.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    if (query.length === 0) {
      dropdown.style.display = 'none';
      return;
    }

    const filtered = companies.filter(c =>
      c[0].toLowerCase().includes(query) || c[1].toLowerCase().includes(query)
    ).slice(0, 10);

    if (filtered.length === 0) {
      dropdown.innerHTML = '<div style="padding: 1rem; color: #999; text-align: center;">No results found</div>';
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = filtered.map(c => `
      <div style="
        padding: 0.75rem 1rem;
        cursor: pointer;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
      " class="company-option" onmouseover="this.style.background='rgba(102, 126, 234, 0.1)'" onmouseout="this.style.background='transparent'">
        <strong>${c[0]}</strong> <span style="color: #667eea; margin-left: 0.5rem;">(${c[1]})</span>
      </div>
    `).join('');

    dropdown.style.display = 'block';

    // Add click handlers
    document.querySelectorAll('.company-option').forEach((el, idx) => {
      el.addEventListener('click', () => {
        companyInput.value = `${filtered[idx][0]} (${filtered[idx][1]})`;
        dropdown.style.display = 'none';
      });
    });
  });

  // Hide dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (e.target !== companyInput) {
      dropdown.style.display = 'none';
    }
  });

  // Update summary on input
  function updateSummary() {
    const amount = parseFloat(amountInput.value) || 0;
    const shares = parseInt(sharesInput.value) || 0;
    const perShare = shares > 0 ? (amount / shares).toFixed(2) : '0.00';

    document.getElementById('totalCost').textContent = '$' + amount.toFixed(2);
    document.getElementById('perShare').textContent = '$' + perShare;
  }

  amountInput.addEventListener('input', updateSummary);
  sharesInput.addEventListener('input', updateSummary);

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Validation
    if (!companyInput.value) {
      showError('companyError', 'Please select a company');
      return;
    }

    submitBtn.classList.add('loading');

    try {
      const formData = new FormData(form);
      const response = await fetch('/add-holding/', {
        method: 'POST',
        body: formData,
      });

      const text = await response.text();

      if (response.ok && text === 'Success') {
        successMsg.classList.add('show');
        form.reset();
        updateSummary();

        setTimeout(() => {
          successMsg.classList.remove('show');
          // Optionally redirect
          // window.location.href = '/dashboard/';
        }, 3000);
      } else {
        showError('companyError', text || 'Failed to add holding');
      }
    } catch (error) {
      showError('companyError', 'Error: ' + error.message);
    } finally {
      submitBtn.classList.remove('loading');
    }
  });

  function showError(elementId, message) {
    const el = document.getElementById(elementId);
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
  }

  // Set today as default date
  dateInput.valueAsDate = new Date();
</script>
{% endblock %}
